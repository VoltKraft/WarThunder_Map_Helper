version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The reduced build needs a source-level review and regenerated packages.
      # See docs/REDUCED_AVALONIA.md; never replace the local variant automatically.
      - dependency-name: "Avalonia*"
      # Remove when Avalonia.Headless.XUnit supports the xUnit 4.x discovery API.
      - dependency-name: "xunit.v3"
        update-types: ["version-update:semver-major"]
    groups:
      desktop-rendering:
        patterns:
          - "Avalonia*"
          - "SkiaSharp*"
      test-tooling:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
