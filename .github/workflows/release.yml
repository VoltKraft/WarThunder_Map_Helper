name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main-push CI run ID to publish or retry (artifacts must still exist)
        required: true
        type: string

permissions:
  contents: read

# Do not cancel a publication halfway through. Public versions are never overwritten.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate tested release source
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      run_id: ${{ steps.source.outputs.run_id }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      state: ${{ steps.plan.outputs.state }}
    steps:
      # Validate with trusted workflow code before checking out a workflow_run SHA.
      - name: Check CI provenance and main ancestry
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CI_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.ci_run_id }}
        with:
          script: |
            const raw = process.env.CI_RUN_ID;
            if (!/^[1-9][0-9]*$/.test(raw)) throw new Error('CI run ID must be numeric.');
            const runId = Number(raw);
            if (!Number.isSafeInteger(runId)) throw new Error('CI run ID is out of range.');
            const { data: workflow } = await github.rest.actions.getWorkflow({
              ...context.repo, workflow_id: 'ci.yml'
            });
            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: runId
            });
            if (run.workflow_id !== workflow.id || run.event !== 'push' ||
                run.status !== 'completed' || run.conclusion !== 'success' ||
                run.head_branch !== 'main' ||
                run.head_repository?.full_name !== context.payload.repository.full_name ||
                !/^[0-9a-f]{40}$/.test(run.head_sha)) {
              throw new Error('Only a successful CI push on this repository main is releasable.');
            }
            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              ...context.repo, basehead: run.head_sha + '...main'
            });
            if (!['ahead', 'identical'].includes(comparison.status)) {
              throw new Error('The tested commit is no longer on main.');
            }
            core.setOutput('sha', run.head_sha);
            core.setOutput('run_id', String(run.id));
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - name: Plan immutable version publication
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.source.outputs.sha }}
        run: python3 scripts/github_release.py plan --sha "$TARGET_SHA" --github-output "$GITHUB_OUTPUT"

  publish:
    name: Publish complete verified release
    needs: prepare
    if: needs.prepare.outputs.state == 'new' || needs.prepare.outputs.state == 'resume'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      state: ${{ steps.publication.outputs.state }}
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Download packages from the verified CI run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.run_id }}
          pattern: map-helper-*
          merge-multiple: true
          path: artifacts/release
      - name: Verify checksums, resume draft and publish
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.prepare.outputs.sha }}
        run: python3 scripts/github_release.py publish --sha "$TARGET_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Release summary
        if: steps.publication.outputs.state == 'published'
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET_SHA: ${{ needs.prepare.outputs.sha }}
          CI_RUN_ID: ${{ needs.prepare.outputs.run_id }}
        run: |
          {
            echo "Published $TAG from tested commit $TARGET_SHA."
            echo "Packages came from CI run $CI_RUN_ID; SHA256SUMS lists all eight packages."
          } >> "$GITHUB_STEP_SUMMARY"

  distribution:
    name: Dispatch ${{ matrix.workflow }}
    needs: [prepare, publish]
    if: >-
      always() && needs.prepare.result == 'success' &&
      ((needs.publish.result == 'success' && needs.publish.outputs.state == 'published') || needs.prepare.outputs.state == 'published')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - workflow: winget.yml
            submit: 'true'
          - workflow: flathub.yml
            submit: 'false'
    steps:
      # GITHUB_TOKEN-created releases do not trigger a second release event workflow.
      - name: Trigger store preparation explicitly
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          WORKFLOW: ${{ matrix.workflow }}
          SUBMIT: ${{ matrix.submit }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo, workflow_id: process.env.WORKFLOW, ref: 'main',
              inputs: { release_tag: process.env.RELEASE_TAG, submit: process.env.SUBMIT }
            });
